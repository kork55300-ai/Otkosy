const VER='13';

/* ===== Э0: резервная копия (только добавление, существующая логика не затронута) ===== */
const BKX=['otkosy-lastbackup','otkosy-undo'];
const u8=q=>new TextEncoder().encode(q),hexs=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),sha=async b=>hexs(await crypto.subtle.digest('SHA-256',b));
const dl=(n,b)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000)};
const idbList=async()=>{const d=await DB;if(!d)return null;return new Promise(r=>{const o=[],q=d.transaction('p','readonly').objectStore('p').openCursor();q.onsuccess=()=>{const c=q.result;if(c){o.push({id:c.key,blob:c.value});c.continue()}else r(o)};q.onerror=()=>r(null)})};
const dosT=d=>[(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()];
function zipB(E){const P=[],C=[],[tm,dt]=dosT(new Date());let o=0;
 E.forEach(e=>{const nb=u8(e.n),h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,e.c,true);h.setUint32(18,e.s,true);h.setUint32(22,e.s,true);h.setUint16(26,nb.length,true);P.push(h.buffer,nb,e.d);
  const g=new DataView(new ArrayBuffer(46));g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x0800,true);g.setUint16(12,tm,true);g.setUint16(14,dt,true);g.setUint32(16,e.c,true);g.setUint32(20,e.s,true);g.setUint32(24,e.s,true);g.setUint16(28,nb.length,true);g.setUint32(42,o,true);C.push(g.buffer,nb);o+=30+nb.length+e.s});
 if(o>4e9||E.length>65000)throw new Error('Архив слишком большой');let cl=0;C.forEach(x=>cl+=x.byteLength);
 const z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,E.length,true);z.setUint16(10,E.length,true);z.setUint32(12,cl,true);z.setUint32(16,o,true);return new Blob([...P,...C,z.buffer],{type:'application/zip'})}
async function zipList(f){const n=f.size,tail=new Uint8Array(await f.slice(Math.max(0,n-65557),n).arrayBuffer()),dv=new DataView(tail.buffer);let p=tail.length-22;while(p>=0&&dv.getUint32(p,true)!==0x06054b50)p--;if(p<0)throw new Error('Это не ZIP-архив или файл повреждён');

 for(let i=0;i<cnt;i++){if(cd.getUint32(q,true)!==0x02014b50)throw new Error('Повреждён список файлов архива');const nl=cd.getUint16(q+28,true),el=cd.getUint16(q+30,true),cl=cd.getUint16(q+32,true);
  L.push({n:new TextDecoder().decode(new Uint8Array(cd.buffer,q+46,nl)),m:cd.getUint16(q+10,true),c:cd.getUint32(q+16,true),cs:cd.getUint32(q+20,true),s:cd.getUint32(q+24,true),o:cd.getUint32(q+42,true)});q+=46+nl+el+cl}
 return L}
async function zipGet(f,e){const h=new DataView(await f.slice(e.o,e.o+30).arrayBuffer()),st=e.o+30+h.getUint16(26,true)+h.getUint16(28,true);let b=f.slice(st,st+e.cs);
 if(e.m===8)b=await new Response(b.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();else if(e.m!==0)throw new Error('Неподдерживаемый способ сжатия в архиве');return b}
async function bkVerify(f,set){const R={ok:false,err:[],warn:[]};let L;try{L=await zipList(f)}catch(e){R.err.push(e.message);return R}
 const by={};L.forEach(e=>by[e.n]=e);if(!by['manifest.json']||!by['data.json']){R.err.push('В архиве нет manifest.json или data.json: это не резервная копия Otkosy');return R}
 let man,ls,dj;try{man=JSON.parse(await(await zipGet(f,by['manifest.json'])).text());dj=await(await zipGet(f,by['data.json'])).arrayBuffer();ls=JSON.parse(new TextDecoder().decode(dj))}catch(e){R.err.push('Не удалось прочитать данные: '+e.message);return R}
 if(man.format!=='otkosy-backup')R.err.push('Неизвестный формат копии');if(man.formatVersion>1)R.err.push('Копия создана более новой версией приложения');
 if(await sha(dj)!==man.dataSha256)R.err.push('Контрольная сумма данных не совпадает');
 const ph=L.filter(e=>e.n.startsWith('photos/')),pm={},blobs={},bad={};(man.photos||[]).forEach(p=>pm[p.id]=p);let i=0;
 for(const e of ph){if(set)set(`Проверка фото ${++i} из ${ph.length}…`);const id=e.n.slice(7).replace(/\.jpg$/,''),b=await zipGet(f,e),u=new Uint8Array(await b.arrayBuffer());
  if(crc(u)!==e.c||u.length!==e.s){R.err.push('Фото повреждено: '+id);bad[id]=1;continue}
  if(!pm[id])R.warn.push('Лишнее фото в архиве: '+id);else if(pm[id].crc!==e.c){R.err.push('Фото не совпадает с описью: '+id);bad[id]=1;continue}blobs[id]=b}
 (man.photos||[]).forEach(p=>{if(!blobs[p.id]&&!bad[p.id])R.err.push('Фото из описи отсутствует в архиве: '+p.id)});
 let objs=[],items=0;if(man.dataCorrupt)R.warn.push('В копии сохранены повреждённые данные объектов «как есть»');else{try{objs=JSON.parse(ls['otkosy-v1']||'[]');items=objs.reduce((n,o)=>n+o.in.items.length+o.out.items.length,0)}catch(e){R.err.push('Данные объектов в копии повреждены')}
  if(man.counts&&(man.counts.objects!==objs.length||man.counts.items!==items))R.err.push('Количество объектов или замеров не совпадает с описью')}
 if(man.counts&&man.counts.photosMissing)R.warn.push(`При создании копии в замерах были указаны фото, которых не оказалось в памяти телефона: ${man.counts.photosMissing}`);

async function bkCompare(R){let cur=[];try{cur=JSON.parse(localStorage.getItem('otkosy-v1')||'[]')}catch(e){}const cm={};cur.forEach(o=>cm[o.id]=JSON.stringify(o));const pl=await idbList()||[],have=new Set(pl.map(p=>p.id)),bid=new Set(R.objs.map(o=>o.id));

 return{same,diff,add,phHave,phAdd,curObjs:cur.length,curItems:cur.reduce((n,o)=>n+o.in.items.length+o.out.items.length,0),curPh:pl.length,onlyHere:cur.filter(o=>!bid.has(o.id)).length}}
