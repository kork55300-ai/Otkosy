<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb"><title>Замеры откосов</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f24;--mu:#6a737d;--pr:#1f6feb;--bd:#d0d7de;--dg:#d1242f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#8b949e;--pr:#4493f8;--bd:#30363d;--dg:#f85149}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#8b949e;--pr:#4493f8;--bd:#30363d;--dg:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,sans-serif;max-width:640px;margin:auto;padding:12px 12px 90px}
h1{font-size:22px;margin:8px 0 12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
button{font:inherit;min-height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:0 16px}
.b{background:var(--pr);color:#fff;border:0;font-weight:600}.d{color:var(--dg)}.w{width:100%}
input,select{font:inherit;width:100%;min-height:52px;border:1px solid var(--bd);border-radius:12px;padding:0 12px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:14px;color:var(--mu);margin:8px 0 3px}.row{display:flex;gap:8px}.row>*{flex:1}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1}.tabs .on{background:var(--pr);color:#fff;border:0}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:14px}.big{font-size:22px;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);display:flex;gap:8px;max-width:640px;margin:auto}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.tot{text-align:right}.wk{margin-bottom:4px}.wk>div:last-child{padding:0 4px 8px}.chk{display:flex;align-items:center;gap:12px;font-size:17px;color:var(--tx);margin:6px 0;min-height:48px;padding:0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}.chk input{width:26px;height:26px;min-height:26px;flex:0 0 auto}
</style></head><body><div id="app"></div><div id="ov"></div>
<script>
const KEY='otkosy-v1';let S={objs:[],cur:null,tab:'in'};
try{const r=localStorage.getItem(KEY);if(r)S.objs=JSON.parse(r)}catch(e){}
try{S.objs.forEach(o=>['in','out'].forEach(k=>{o[k].nol=o[k].nol||[]}))}catch(e){}
try{S.objs.forEach(o=>['in','out'].forEach(k=>o[k].items.forEach(i=>{if(!i.types){i.types=i.type?[i.type]:[];delete i.type}})))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S.objs))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lm=i=>((+i.l||0)+(+i.r||0)+(+i.t||0))/1000,f=n=>n.toFixed(2).replace('.',',');
const cur=()=>S.objs.find(o=>o.id===S.cur),sec=()=>cur()[S.tab];
const SN={in:'Внутренние работы',out:'Наружные работы'};
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?d.split('-').reverse().join('.'):'';
const eff=(i,t,k)=>{const v=i.ov&&i.ov[t]?i.ov[t][k]:'';return v!==''&&v!=null?v:i[k]};
const lmT=(i,t)=>lm({l:eff(i,t,'l'),r:eff(i,t,'r'),t:eff(i,t,'t')});
const isN=(s,t)=>(s.nol||[]).includes(t),un=(s,t)=>isN(s,t)?'шт':'м.п.';
const tT=(s,t)=>{const a=s.items.filter(i=>(i.types||[]).includes(t));return isN(s,t)?a.length:a.reduce((q,i)=>q+lmT(i,t),0)};
const fv=(s,t)=>isN(s,t)?String(tT(s,t)):f(tT(s,t));
function confirmBox(msg,ok){$('#ov').innerHTML=`<div class="ov"><div class="sh"><p class="big">${esc(msg)}</p><div class="row"><button onclick="closeOv()">Отмена</button><button class="b" style="background:var(--dg)" id="yes">Удалить</button></div></div></div>`;$('#yes').onclick=()=>{closeOv();ok()}}
const closeOv=()=>$('#ov').innerHTML='';
function render(){const a=$('#app');S.cur?objView(a):listView(a)}
function listView(a){
 a.innerHTML=`<h1>Замеры откосов</h1>`+(S.objs.length?'':'<div class="card mu">Объектов пока нет. Нажмите «Новый объект».</div>')+
 S.objs.map(o=>`<div class="card it"><div onclick="openObj('${o.id}')" style="flex:1"><b>${esc(o.name)||'Без названия'}</b><div class="mu">${o.client?esc(o.client)+' · ':''}${fd(o.date)} · В: ${o.in.items.length}, Н: ${o.out.items.length}</div></div><button class="d" onclick="delObj('${o.id}')">✕</button></div>`).join('')+
 `<div class="bar"><button class="b w" onclick="newObj()">+ Новый объект</button></div>`}
function newObj(){const o={id:uid(),name:'',client:'',phone:'',date:today(),in:{w:'',types:['Штукатурка'],items:[]},out:{w:'',types:[],items:[]}};S.objs.unshift(o);S.cur=o.id;S.tab='in';save();render()}
function openObj(id){S.cur=id;S.tab='in';render()}
function delObj(id){confirmBox('Удалить объект со всеми замерами?',()=>{S.objs=S.objs.filter(o=>o.id!==id);save();render()})}
function objView(a){const o=cur(),s=sec();
 a.innerHTML=`<div class="row" style="margin-bottom:8px"><button onclick="S.cur=null;render()" style="flex:0 0 auto">← Назад</button></div>
 <div class="card"><label>Название или адрес</label><input id="nm" value="${esc(o.name)}" placeholder="ул. Ленина, 5, кв. 12">
 <label>Дата замеров</label><input id="dt" type="date" value="${esc(o.date)}"><label>Заказчик (ФИО)</label><input id="cl" value="${esc(o.client)}" placeholder="Иванов Иван Иванович" autocomplete="name"><label>Телефон заказчика</label><input id="ph" type="tel" inputmode="tel" value="${esc(o.phone)}" placeholder="+7 900 000-00-00" autocomplete="tel"></div>
 <div class="tabs"><button class="${S.tab=='in'?'on':''}" onclick="S.tab='in';render()">Внутренние</button><button class="${S.tab=='out'?'on':''}" onclick="S.tab='out';render()">Наружные</button></div>
 <div class="card"><label>Ширина откосов, мм (${SN[S.tab].toLowerCase()})</label><input id="sw" inputmode="decimal" value="${esc(s.w)}">
 <label>Виды работ: ${s.types.length?esc(s.types.join(', ')):'не заданы'}</label>
 <div class="row"><input id="nt" placeholder="Новый вид работ"><button onclick="addType()" style="flex:0 0 auto">Добавить</button></div><label class="chk"><input type="checkbox" id="nn"><span>Без погонажа (просто работа, считается в шт.)</span></label>
 ${s.types.filter((t,i)=>S.tab=='out'||i>0).map(t=>`<button class="d" style="min-height:40px;margin:6px 6px 0 0" onclick="delType('${esc(t)}')">✕ ${esc(t)}${isN(s,t)?' (шт)':''}</button>`).join('')}</div>
 ${s.items.map((i,k)=>`<div class="card it"><div onclick="editItem('${i.id}')" style="flex:1"><b>В${k+1}</b> <div class="mu">${(i.types||[]).length?i.types.map(t=>esc(t)+(isN(s,t)?' ✓':' '+f(lmT(i,t)))+(i.ov&&i.ov[t]&&Object.values(i.ov[t]).some(v=>v!=='')?'*':'')).join(' · '):'работа не выбрана'}</div><div class="mu">${i.l||0} / ${i.r||0} / ${i.t||0} мм${i.w?' · откос '+esc(i.w):''}</div>${i.note?`<div class="mu">${esc(i.note)}</div>`:''}</div><div class="big">${(i.types||[]).length?'':f(lm(i))}</div></div>`).join('')}
 <div class="card tot"><div class="mu">Итого: ${SN[S.tab].toLowerCase()}</div>${s.types.length?s.types.map(t=>`<div class="big">${esc(t)}: ${fv(s,t)} ${un(s,t)}</div>`).join(''):'<div class="mu">Добавьте вид работ</div>'}</div>
 <div class="bar"><button class="b" style="flex:2" onclick="editItem()">+ Окно / дверь</button><button onclick="exportMenu()">Экспорт</button></div>`;
 $('#nm').oninput=e=>{o.name=e.target.value;save()};$('#dt').oninput=e=>{o.date=e.target.value;save()};$('#cl').oninput=e=>{o.client=e.target.value;save()};$('#ph').oninput=e=>{o.phone=e.target.value;save()};$('#sw').oninput=e=>{s.w=e.target.value;save()}}
function addType(){const v=$('#nt').value.trim(),s=sec();if(v&&!s.types.includes(v)){s.types.push(v);if($('#nn').checked)(s.nol=s.nol||[]).push(v);save();render()}}
function delType(t){const s=sec();confirmBox(`Удалить вид работ «${t}»?`,()=>{s.types=s.types.filter(x=>x!==t);s.nol=(s.nol||[]).filter(x=>x!==t);s.items.forEach(i=>{i.types=(i.types||[]).filter(x=>x!==t)});save();render()})}
function editItem(id){const s=sec(),it=s.items.find(i=>i.id===id)||{id:'',l:'',r:'',t:'',w:s.w,note:'',types:s.types.slice(0,1),ov:{}};const n=id?s.items.indexOf(it)+1:s.items.length+1;
 const fld=(k,l)=>`<div><label>${l}</label><input id="f${k}" inputmode="decimal" value="${esc(it[k])}" oninput="pv()"></div>`;
 $('#ov').innerHTML=`<div class="ov"><div class="sh"><div class="it"><h1 style="margin:0">В${n}</h1><div class="big" id="pv"></div></div>
 ${s.types.length?`<label>Виды работ (можно несколько)</label>${s.types.map((t,k)=>{const o=(it.ov||{})[t]||{},on=(it.types||[]).includes(t),inp=(q,l)=>`<div><label>${l}</label><input data-k="${k}" data-f="${q}" inputmode="decimal" value="${esc(o[q]??'')}" oninput="pv()"></div>`;return `<div class="wk"><label class="chk"><input type="checkbox" value="${k}" ${on?'checked':''} onchange="pv()"><span>${esc(t)}</span><b id="wl${k}" style="margin-left:auto"></b></label><div style="display:${on?'block':'none'}" id="wo${k}">${isN(s,t)?'':`<div class="mu">Свои размеры для этой работы, мм (пусто = как у окна)</div><div class="row">${inp('l','Левая')}${inp('r','Правая')}</div><div class="row">${inp('t','Верхняя')}${inp('w','Ширина')}</div>`}</div></div>`}).join('')}`:''}
 <div class="row">${fld('l','Левая, мм')}${fld('r','Правая, мм')}</div><div class="row">${fld('t','Верхняя, мм')}${fld('w','Ширина откоса, мм')}</div>
 <label>Примечание</label><input id="fnote" value="${esc(it.note)}">
 <div class="row" style="margin-top:14px"><button onclick="closeOv()">Отмена</button><button class="b" onclick="saveItem('${id||''}')">Сохранить</button></div>
 ${id?`<button class="d w" style="margin-top:8px" onclick="delItem('${id}')">Удалить замер</button>`:''}</div></div>`;pv()}
function pv(){const g=k=>$('#f'+k).value;$('#pv').textContent=f(lm({l:g('l'),r:g('r'),t:g('t')}))+' м.п.';
document.querySelectorAll('#ov [data-f]').forEach(e=>e.placeholder=g(e.dataset.f)||'0');
sec().types.forEach((t,k)=>{const c=document.querySelector(`#ov input[type=checkbox][value="${k}"]`);if(!c)return;$('#wo'+k).style.display=c.checked?'block':'none';if(isN(sec(),t)){$('#wl'+k).textContent=c.checked?'✓':'';return}
const v=q=>{const e=document.querySelector(`#ov [data-k="${k}"][data-f="${q}"]`).value.trim();return e!==''?e:g(q)};$('#wl'+k).textContent=c.checked?f(lm({l:v('l'),r:v('r'),t:v('t')})):''})}
function ovOf(s){const o={};document.querySelectorAll('#ov input[type=checkbox]:checked').forEach(c=>{if(isN(s,s.types[+c.value]))return;const r={};['l','r','t','w'].forEach(q=>{r[q]=document.querySelector(`#ov [data-k="${c.value}"][data-f="${q}"]`).value.trim()});o[s.types[+c.value]]=r});return o}
function saveItem(id){const s=sec(),g=k=>$('#f'+k).value.trim();const d={l:g('l'),r:g('r'),t:g('t'),w:g('w'),note:$('#fnote').value.trim(),types:[...document.querySelectorAll('#ov input[type=checkbox]:checked')].map(c=>s.types[+c.value]),ov:ovOf(s)};
 if(id)Object.assign(s.items.find(i=>i.id===id),d);else s.items.push({id:uid(),...d});save();closeOv();render()}
function delItem(id){confirmBox('Удалить этот замер?',()=>{const s=sec();s.items=s.items.filter(i=>i.id!==id);save();render()})}
function exportMenu(){$('#ov').innerHTML=`<div class="ov"><div class="sh"><h1>Экспорт ведомости</h1><button class="b w" onclick="doXlsx()">Excel (.xlsx)</button><button class="b w" style="margin-top:8px" onclick="doPdf()">PDF</button><button class="w" style="margin-top:8px" onclick="closeOv()">Закрыть</button></div></div>`}
function rowsAll(){const o=cur(),A=[],B=[],N=v=>v===''||v==null?'':+v||0;['in','out'].forEach(k=>{const s=o[k],sn=k=='in'?'Внутренние':'Наружные';
 s.items.forEach((i,n)=>{const T=i.types||[];if(!T.length)A.push([sn,'В'+(n+1),'',N(i.l),N(i.r),N(i.t),N(i.w),+lm(i).toFixed(3),i.note||'']);
  T.forEach(t=>A.push(isN(s,t)?[sn,'В'+(n+1),t,'','','','','',i.note||'']:[sn,'В'+(n+1),t,N(eff(i,t,'l')),N(eff(i,t,'r')),N(eff(i,t,'t')),N(eff(i,t,'w')),+lmT(i,t).toFixed(3),i.note||'']))});
 s.types.forEach(t=>B.push([sn,t,+tT(s,t).toFixed(3),isN(s,t)?'шт':'пог. м',N(s.w)]))});return[A,B,o]}
const fname=ext=>'Ведомость_'+(cur().name||'объект').replace(/[^\wа-яё]+/gi,'_').slice(0,40)+'.'+ext;
function out(name,data){const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);closeOv()}
function crc(b){let t=crc.t;if(!t){t=crc.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t.push(c>>>0)}}let r=-1;for(const v of b)r=t[(r^v)&255]^(r>>>8);return(r^-1)>>>0}
function mkzip(F){const E=new TextEncoder(),P=[],C=[];let o=0;
F.forEach(([n,s])=>{const nb=E.encode(n),d=E.encode(s),c=crc(d);
const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);
P.push(h.buffer,nb,d);
const g=new DataView(new ArrayBuffer(46));g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x0800,true);g.setUint32(16,c,true);g.setUint32(20,d.length,true);g.setUint32(24,d.length,true);g.setUint16(28,nb.length,true);g.setUint32(42,o,true);
C.push(g.buffer,nb);o+=30+nb.length+d.length});
let cl=0;C.forEach(x=>cl+=x.byteLength);
const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,F.length,true);e.setUint16(10,F.length,true);e.setUint32(12,cl,true);e.setUint32(16,o,true);
return new Blob([...P,...C,e.buffer])}
function xmlSheet(R,W){const L='ABCDEFGHI',x2=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rows=R.map((r,i)=>`<row r="${i+1}">`+r.map((v,j)=>v===''||v==null?'':typeof v==='number'?`<c r="${L[j]}${i+1}"><v>${v}</v></c>`:`<c r="${L[j]}${i+1}" t="inlineStr"><is><t xml:space="preserve">${x2(v)}</t></is></c>`).join('')+'</row>').join('');
return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>'+W.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols><sheetData>'+rows+'</sheetData></worksheet>'}
function doXlsx(){const[A,B,o]=rowsAll(),H0='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
const S=[['Замеры',[['Раздел','№','Работа','Левая, мм','Правая, мм','Верх, мм','Ширина откоса, мм','Пог. м','Примечание'],...A],[11,6,18,10,10,10,14,9,24]],
['Итоги',[['Раздел','Работа','Итого','Ед.','Ширина откосов раздела, мм'],...B],[11,20,10,8,18]],
['Объект',[['Объект',o.name||''],['Заказчик',o.client||''],['Телефон',o.phone||''],['Дата',fd(o.date)]],[12,34]]];
const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
out(fname('xlsx'),mkzip([
['[Content_Types].xml',H0+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+S.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'],
['_rels/.rels',H0+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="'+R+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
['xl/workbook.xml',H0+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="'+R+'"><sheets>'+S.map((q,i)=>`<sheet name="${q[0]}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'],
['xl/_rels/workbook.xml.rels',H0+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+S.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+'</Relationships>'],
...S.map((q,i)=>[`xl/worksheets/sheet${i+1}.xml`,xmlSheet(q[1],q[2])])]))}
function drawCard(g,cx,cy,title,i,T,COL,NL){const n=Math.max(T.length,1),top=cy+40+22*n,g0=14+10*n,rw=300,rh=200,rx=cx+130,ry=top+g0;
 g.textAlign='left';g.font='bold 26px sans-serif';g.fillStyle='#000';g.fillText(title+(i.note?'  ('+i.note.slice(0,28)+')':''),cx,cy+26);
 g.fillStyle='#e8f1fb';g.fillRect(rx,ry,rw,rh);g.strokeStyle='#444';g.lineWidth=4;g.strokeRect(rx,ry,rw,rh);g.lineWidth=2;g.strokeRect(rx+14,ry+14,rw-28,rh-28);g.beginPath();g.moveTo(rx+rw/2,ry+14);g.lineTo(rx+rw/2,ry+rh-14);g.stroke();
 const ra=(v,b)=>{b=+b||0;v=+v||0;return b>0?Math.min(1,v/b):1},ln=(a,b,c,d)=>{g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()};
 T.forEach((t,k)=>{const col=COL[k],d=8+k*10,L=eff(i,t,'l'),R=eff(i,t,'r'),Tt=eff(i,t,'t'),y0=ry+rh+34+22*k;if(NL.includes(t)){g.fillStyle=col;g.fillRect(cx+4,y0-14,16,16);g.fillStyle='#000';g.font='18px sans-serif';g.fillText(t.slice(0,24)+': работа без погонажа',cx+28,y0);return}g.strokeStyle=col;g.lineWidth=6;
  ln(rx-d,ry-d,rx-d,ry-d+(rh+d)*ra(L,i.l));ln(rx-d,ry-d,rx-d+(rw+2*d)*ra(Tt,i.t),ry-d);ln(rx+rw+d,ry-d,rx+rw+d,ry-d+(rh+d)*ra(R,i.r));
