<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1013"><meta name="color-scheme" content="dark"><title>Замеры откосов</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#090c13;--card:#ffffff0b;--card2:#ffffff14;--fld:#05070ca6;--bd:#ffffff18;--tx:#eef1f7;--mu:#98a1b5;--pr:#6aa8ff;--pr2:#7b7dff;--prt:#07101f;--dg:#ff7a85;--ok:#4ade9c;--am:#fbbf4a;--fn:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:#090c13 radial-gradient(900px 520px at 5% -8%,#23458a66,transparent 62%),radial-gradient(760px 520px at 105% 8%,#6a3fc055,transparent 58%),radial-gradient(900px 600px at 50% 118%,#0e7a8a44,transparent 62%) fixed}
body{margin:auto;max-width:640px;color:var(--tx);font:500 16px/1.45 var(--fn);padding:14px 14px 120px;-webkit-font-smoothing:antialiased}
h1{font:600 21px/1.25 Unbounded,var(--fn);letter-spacing:-.02em;margin:10px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 30px #0005}
.card>label:first-child{margin-top:0}
button{font:700 15px var(--fn);min-height:52px;border-radius:16px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);padding:0 16px;transition:background .15s,transform .06s,box-shadow .15s}
button:active{transform:scale(.97);background:#ffffff26}
button:focus-visible,input:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.b{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--prt);border-color:transparent;box-shadow:0 6px 22px #6aa8ff40}.b:active{background:linear-gradient(135deg,#5a98ee,#6b6de8)}
.b2{background:#6aa8ff1f;color:#b4d2ff;border-color:#6aa8ff55}
.gh{background:transparent;color:var(--pr);border:1px dashed #6aa8ff70}
.d{color:var(--dg);background:#ff7a8514;border-color:#ff7a8545}
.w{width:100%}
input,select{font:500 16px var(--fn);width:100%;min-height:52px;border:1px solid var(--bd);border-radius:16px;padding:0 14px;background:var(--fld);color:var(--tx);-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#626b7e}
input:focus{border-color:var(--pr);box-shadow:0 0 0 4px #6aa8ff22;outline:none}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px}
.row{display:flex;gap:10px}.row>*{flex:1}
.tabs,.seg{display:flex;gap:6px;padding:5px;background:var(--fld);border:1px solid var(--bd);border-radius:18px}.tabs{margin-bottom:12px}
.tabs button,.seg button{flex:1;border:0;background:transparent;color:var(--mu);min-height:44px;box-shadow:none}
.tabs .on,.seg .on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--prt)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:2px}.chips button{min-height:40px;white-space:nowrap;padding:0 16px;border-radius:999px;font-size:14px}
.chips .on{background:#6aa8ff26;border-color:var(--pr);color:#c3dcff}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mu{color:var(--mu);font-size:14px}.big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.ttl{font-weight:800;font-size:17px}
.st{font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap}.st0{background:#fbbf4a22;color:var(--am)}.st1{background:#6aa8ff22;color:var(--pr)}.st2{background:#4ade9c22;color:var(--ok)}
.pg{height:6px;border-radius:6px;background:#ffffff14;margin:12px 0 6px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--ok));border-radius:6px}
.act{margin-top:12px}.act button{min-height:44px;font-size:14px;padding:0 8px}
.itm.fin{border-color:#4ade9c55;background:#4ade9c10}
.kd{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--pr);background:#6aa8ff1f;padding:3px 9px;border-radius:8px;margin-left:6px}
.tot{text-align:right;background:linear-gradient(160deg,#6aa8ff1f,#7b7dff14);border-color:#6aa8ff40}.tot .big{font-size:19px;color:#b4d2ff}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:auto;padding:10px;background:#0b0f19d0;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:26px;display:flex;gap:8px;box-shadow:0 12px 40px #000b}
.bar button{flex:1;padding:0 10px}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:linear-gradient(180deg,#171c29,#0f131c);border:1px solid var(--bd);border-bottom:0;width:100%;max-width:640px;max-height:93%;overflow:auto;border-radius:28px 28px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.chk{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--tx);margin:8px 0;min-height:52px;padding:0 14px;border:1px solid var(--bd);border-radius:16px;background:var(--fld)}
.chk:has(input:checked){border-color:#6aa8ff66;background:#6aa8ff14}
.chk input{-webkit-appearance:none;appearance:none;width:26px;height:26px;min-height:26px;flex:0 0 26px;border:2px solid #4d566b;border-radius:9px;padding:0;background:transparent;display:grid;place-content:center}
.chk input:checked{background:linear-gradient(135deg,var(--pr),var(--pr2));border-color:transparent}
.chk input:checked::after{content:"";width:6px;height:12px;border:solid var(--prt);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.wk{margin-bottom:4px}.wk>div:last-child:not(:empty){margin:-2px 0 8px;padding:4px 12px 12px;background:#0006;border:1px solid var(--bd);border-radius:16px}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.th{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--bd);background:var(--fld)}
.th img{width:100%;height:100%;object-fit:cover;display:block}.th span{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;background:#000b;padding:2px 8px;border-radius:8px}
.th button{position:absolute;right:4px;top:4px;min-height:30px;width:30px;padding:0;border-radius:10px;background:#000b;color:#fff;border:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#1b2231;border:1px solid var(--bd);padding:12px 18px;border-radius:14px;z-index:20;box-shadow:0 8px 30px #000a;font-weight:700}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600&display=swap"></head><body><div id="app"></div><div id="ov"></div>
<script>
const KEY='otkosy-v1';let S={objs:[],cur:null,tab:'in',q:'',sort:'new',st:''};
try{const r=localStorage.getItem(KEY);if(r)S.objs=JSON.parse(r)}catch(e){}
try{S.objs.forEach(o=>{o.st=o.st||'замер';['in','out'].forEach(k=>{o[k].nol=o[k].nol||[]})})}catch(e){}
try{S.objs.forEach(o=>['in','out'].forEach(k=>o[k].items.forEach(i=>{if(!i.types){i.types=i.type?[i.type]:[];delete i.type}})))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S.objs))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lm=i=>((+i.l||0)+(+i.r||0)+(+i.t||0))/1000,f=n=>n.toFixed(2).replace('.',',');
const cur=()=>S.objs.find(o=>o.id===S.cur),sec=()=>cur()[S.tab];
const SN={in:'Внутренние работы',out:'Наружные работы'};
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?d.split('-').reverse().join('.'):'';
const eff=(i,t,k)=>{const v=i.ov&&i.ov[t]?i.ov[t][k]:'';return v!==''&&v!=null?v:i[k]};
const lmT=(i,t)=>lm({l:eff(i,t,'l'),r:eff(i,t,'r'),t:eff(i,t,'t')});
const isN=(s,t)=>(s.nol||[]).includes(t),un=(s,t)=>isN(s,t)?'шт':'м.п.';
const tT=(s,t)=>{const a=s.items.filter(i=>(i.types||[]).includes(t));return isN(s,t)?a.length:a.reduce((q,i)=>q+lmT(i,t),0)};
const fv=(s,t)=>isN(s,t)?String(tT(s,t)):f(tT(s,t));
function confirmBox(msg,ok){$('#ov').innerHTML=`<div class="ov"><div class="sh"><p class="big">${esc(msg)}</p><div class="row"><button onclick="closeOv()">Отмена</button><button class="b" style="background:var(--dg)" id="yes">Удалить</button></div></div></div>`;$('#yes').onclick=()=>{closeOv();ok()}}
const closeOv=()=>$('#ov').innerHTML='';
const DEF={in:{types:['Штукатурка','Сендвич-панели','Сендвич-панели(каркас)','Акрил','Уголок','Демонтаж'],nol:['Демонтаж']},out:{types:['Пенопласт','Покраска','Штукатурка','Контршульц'],nol:[]}},ST=['замер','в работе','сдан'],TPL='otkosy-tpl';let TP=null,DR={ph:[],add:[],rem:[]};try{TP=JSON.parse(localStorage.getItem(TPL))}catch(e){}
const DB=new Promise(r=>{try{const q=indexedDB.open('otkosy-ph',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const pdb=(m,k,v)=>DB.then(d=>d?new Promise(r=>{const t=d.transaction('p',m==='get'?'readonly':'readwrite').objectStore('p'),q=m==='get'?t.get(k):m==='put'?t.put(v,k):t.delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}):null);
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const slots=o=>{let n=0,d=0;['in','out'].forEach(k=>o[k].items.forEach(i=>{const T=i.types||[];n+=T.length;d+=T.filter(t=>i.done&&i.done[t]).length}));return[n,d]};
function render(){const a=$('#app');S.cur?objView(a):listView(a)}
function listView(a){a.innerHTML=`<h1>Замеры откосов</h1><input id="q" type="search" placeholder="Поиск: адрес, заказчик, телефон" value="${esc(S.q)}">
<div class="chips">${['',...ST].map(t=>`<button class="${S.st===t?'on':''}" onclick="S.st='${t}';listView($('#app'))">${t||'Все'}</button>`).join('')}<button onclick="S.sort=S.sort=='new'?'old':'new';listView($('#app'))">${S.sort=='new'?'Новые ↓':'Старые ↑'}</button></div>
<div id="lst"></div><div class="bar"><button class="b" onclick="newObj()">+ Новый объект</button></div>`;
$('#q').oninput=e=>{S.q=e.target.value;fillList()};fillList()}
function fillList(){const q=S.q.trim().toLowerCase(),L=S.objs.filter(o=>(!S.st||o.st===S.st)&&(!q||[o.name,o.client,o.phone].join(' ').toLowerCase().includes(q))).sort((a,b)=>(a.date<b.date?1:a.date>b.date?-1:0)*(S.sort=='new'?1:-1));
$('#lst').innerHTML=L.length?L.map(o=>{const[n,d]=slots(o);return `<div class="card"><div class="it"><div onclick="openObj('${o.id}')" style="flex:1"><div class="ttl">${esc(o.name)||'Без названия'}</div><div class="mu">${o.client?esc(o.client)+' · ':''}${fd(o.date)}</div><div class="mu">Внутр. ${o.in.items.length} · Нар. ${o.out.items.length}</div></div><span class="st st${ST.indexOf(o.st)}">${esc(o.st)}</span></div>${n?`<div class="pg"><i style="width:${Math.round(d/n*100)}%"></i></div><div class="mu">Выполнено ${d} из ${n}</div>`:''}<div class="row act"><button onclick="openObj('${o.id}')">Открыть</button><button onclick="dupObj('${o.id}')">Копия</button><button class="d" onclick="delObj('${o.id}')">Удалить</button></div></div>`}).join(''):'<div class="card mu">Ничего не найдено. Нажмите «Новый объект».</div>'}
function newObj(){const T=TP||DEF,mk=k=>({w:'',types:T[k].types.slice(),nol:(T[k].nol||[]).slice(),items:[]}),o={id:uid(),name:'',client:'',phone:'',date:today(),st:'замер',in:mk('in'),out:mk('out')};S.objs.unshift(o);S.cur=o.id;S.tab='in';save();render()}
function openObj(id){S.cur=id;S.tab='in';render()}
function dupObj(id){const o=JSON.parse(JSON.stringify(S.objs.find(x=>x.id===id)));o.id=uid();o.name=(o.name||'Объект')+' (копия)';o.date=today();o.st='замер';['in','out'].forEach(k=>o[k].items.forEach(i=>{i.id=uid();i.ph=[];i.done={}}));S.objs.unshift(o);save();render();toast('Копия создана (без фото и отметок)')}
function delObj(id){confirmBox('Удалить объект со всеми замерами?',()=>{const o=S.objs.find(x=>x.id===id);['in','out'].forEach(k=>o[k].items.forEach(i=>(i.ph||[]).forEach(p=>pdb('del',p.id))));S.objs=S.objs.filter(x=>x.id!==id);save();render()})}
function saveTpl(){const o=cur();TP={in:{types:o.in.types.slice(),nol:(o.in.nol||[]).slice()},out:{types:o.out.types.slice(),nol:(o.out.nol||[]).slice()}};try{localStorage.setItem(TPL,JSON.stringify(TP))}catch(e){}toast('Шаблон сохранён: будет у новых объектов')}
function objView(a){const o=cur(),s=sec();
 a.innerHTML=`<div class="row" style="margin-bottom:10px"><button onclick="S.cur=null;render()" style="flex:0 0 auto">← Назад</button></div>
 <div class="card"><label>Название или адрес</label><input id="nm" value="${esc(o.name)}" placeholder="ул. Ленина, 5, кв. 12">
 <label>Дата замеров</label><input id="dt" type="date" value="${esc(o.date)}">
 <label>Заказчик (ФИО)</label><input id="cl" value="${esc(o.client)}" placeholder="Иванов Иван Иванович" autocomplete="name">
 <label>Телефон заказчика</label><input id="phn" type="tel" inputmode="tel" value="${esc(o.phone)}" placeholder="+7 900 000-00-00" autocomplete="tel">
 <label>Статус объекта</label><div class="seg">${ST.map(t=>`<button class="${o.st===t?'on':''}" onclick="cur().st='${t}';save();render()">${t}</button>`).join('')}</div></div>
 <div class="tabs"><button class="${S.tab=='in'?'on':''}" onclick="S.tab='in';render()">Внутренние</button><button class="${S.tab=='out'?'on':''}" onclick="S.tab='out';render()">Наружные</button></div>
 <div class="card">${S.tab=='in'?`<label>Ширина откосов, мм (внутренние работы)</label><input id="sw" inputmode="decimal" value="${esc(s.w)}">`:''}
 <label>Виды работ</label>
 <div class="row"><input id="nt" placeholder="Новый вид работ"><button onclick="addType()" style="flex:0 0 auto">Добавить</button></div><label class="chk"><input type="checkbox" id="nn"><span>Без погонажа (просто работа, считается в шт.)</span></label>
 ${s.types.map((t,k)=>`<div class="row" style="margin-top:6px"><button style="min-height:44px;text-align:left" onclick="renType(${k})">✎ ${esc(t)}${isN(s,t)?' (шт)':''}</button><button class="d" style="min-height:44px;flex:0 0 56px" onclick="delType(${k})">✕</button></div>`).join('')}
 <button class="gh w" style="margin-top:12px;min-height:44px" onclick="saveTpl()">Сохранить виды работ как шаблон</button></div>
 ${s.items.map((i,k)=>{const T=i.types||[];return `<div class="card it itm${T.length&&T.every(t=>i.done&&i.done[t])?' fin':''}"><div onclick="editItem('${i.id}')" style="flex:1"><b>В${k+1}</b><span class="kd">${esc(i.kind||'окно')}</span>${(i.ph||[]).length?` <span class="mu">📷${i.ph.length}</span>`:''}<div class="mu">${T.length?T.map(t=>esc(t)+(isN(s,t)?' (шт)':' '+f(lmT(i,t)))+(i.done&&i.done[t]?' ✔':'')+(i.ov&&i.ov[t]&&Object.values(i.ov[t]).some(v=>v!=='')?'*':'')).join(' · '):'работа не выбрана'}</div><div class="mu">${i.l||0} / ${i.r||0} / ${i.t||0} мм${i.w?' · откос '+esc(i.w):''}</div>${i.note?`<div class="mu">${esc(i.note)}</div>`:''}</div><div class="big">${T.length?'':f(lm(i))}</div></div>`}).join('')}
 <div class="card tot"><div class="mu">Итого: ${SN[S.tab].toLowerCase()}</div>${s.types.length?s.types.map(t=>`<div class="big">${esc(t)}: ${fv(s,t)} ${un(s,t)}</div>`).join(''):'<div class="mu">Добавьте вид работ</div>'}</div>
 <div class="bar"><button class="b" onclick="editItem('','окно')">+ Окно</button><button class="b2" onclick="editItem('','дверь')">+ Дверь</button><button style="flex:0 0 auto" onclick="exportMenu()">Экспорт</button></div>`;
 $('#nm').oninput=e=>{o.name=e.target.value;save()};$('#dt').oninput=e=>{o.date=e.target.value;save()};$('#cl').oninput=e=>{o.client=e.target.value;save()};$('#phn').oninput=e=>{o.phone=e.target.value;save()};if($('#sw'))$('#sw').oninput=e=>{s.w=e.target.value;save()}}
function renType(k){const t=sec().types[k];$('#ov').innerHTML=`<div class="ov"><div class="sh"><h1>Переименовать работу</h1><input id="rn" value="${esc(t)}"><div class="row" style="margin-top:14px"><button onclick="closeOv()">Отмена</button><button class="b" onclick="doRen(${k})">Сохранить</button></div></div></div>`}
function doRen(k){const s=sec(),t=s.types[k],v=$('#rn').value.trim();if(!v||(v!==t&&s.types.includes(v))){closeOv();return}
 s.types[k]=v;s.nol=(s.nol||[]).map(x=>x===t?v:x);s.items.forEach(i=>{i.types=(i.types||[]).map(x=>x===t?v:x);if(v!==t){if(i.ov&&i.ov[t]){i.ov[v]=i.ov[t];delete i.ov[t]}if(i.done&&i.done[t]){i.done[v]=i.done[t];delete i.done[t]}}});save();closeOv();render()}
function addType(){const v=$('#nt').value.trim(),s=sec();if(v&&!s.types.includes(v)){s.types.push(v);if($('#nn').checked)(s.nol=s.nol||[]).push(v);save();render()}}
function delType(k){const s=sec(),t=s.types[k];confirmBox(`Удалить вид работ «${t}»?`,()=>{s.types=s.types.filter(x=>x!==t);s.nol=(s.nol||[]).filter(x=>x!==t);s.items.forEach(i=>{i.types=(i.types||[]).filter(x=>x!==t);if(i.done)delete i.done[t]});save();render()})}
function editItem(id,kind){const s=sec(),ex=s.items.find(i=>i.id===id),it=ex||{id:'',l:'',r:'',t:'',w:S.tab=='in'?s.w:'',note:'',types:[],ov:{},done:{},ph:[],kind:kind||'окно'},n=ex?s.items.indexOf(ex)+1:s.items.length+1;
 DR={ph:(it.ph||[]).slice(),add:[],rem:[],kind:it.kind||'окно'};
 const fld=(k,l)=>`<div><label>${l}</label><input id="f${k}" inputmode="decimal" enterkeyhint="next" value="${esc(it[k])}" oninput="pv()"></div>`;
 $('#ov').innerHTML=`<div class="ov"><div class="sh" onkeydown="nx(event)"><div class="it"><h1 style="margin:0">В${n} · ${esc(DR.kind)}</h1><div class="big" id="pv"></div></div>
 ${!ex&&s.items.length?`<button class="gh w" style="margin-top:12px" onclick="copyPrev()">↩ Размеры как у В${s.items.length}</button>`:''}
 <div class="row">${fld('l','Левая, мм')}${fld('r','Правая, мм')}</div><div class="row">${fld('t','Верхняя, мм')}${fld('w','Ширина откоса, мм')}</div>
 <label>Примечание</label><input id="fnote" enterkeyhint="done" value="${esc(it.note)}">
